# Builds and tests every push that changes more than documentation; on main it also
# packages what was tested as the image.
# Runs on the self-hosted Forgejo runner (label `docker`). Deploying stays manual.
#
# One job on purpose: the image is built from the workspace this job just tested
# (kaniko as a step container, context `dir://`), so the client is built once and
# what is shipped cannot be a second, independently built copy.
name: build

# Pushes that only touch documentation start no run: nothing in them changes the
# client. A push that also touches anything else builds as usual; a manual run
# always builds.
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# One run per branch at a time, so images for main are published in push order. Forgejo treats this
# as best effort; `latest` additionally only moves to a commit that is still the head of main
# (scripts/promote_image.mjs), so a slow older build cannot put `latest` back.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: docker
    container:
      # Pinned by digest: node-image.yml moves it daily, after the tests pass on the new image. Node 26 no longer ships Corepack.
      image: node:26-bookworm@sha256:5c4012d11d9857c42713ba511fbc19645cac1706bb710d51d42b0d301dff7f88
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Corepack (Mastodon's Yarn; no longer part of Node)
        run: npm install --global corepack@0.36.0
      - name: Import upstream and apply patches
        run: node scripts/prepare.mjs
      # No dependency cache: a cold install takes seconds, a cache per upstream commit half a gigabyte.
      - name: Build
        run: node scripts/build.mjs
      - name: Install Chromium and Firefox for the browser tests
        run: node .work/upstream/node_modules/playwright/cli.js install --with-deps chromium firefox
      - name: Install nginx for the tests against the production configuration
        run: apt-get update && apt-get install -y --no-install-recommends nginx
      - name: Type check and tests
        env:
          # tests/production.test.mjs must run here, not be skipped.
          TEADECK_REQUIRE_NGINX: '1'
        run: node scripts/verify.mjs

      # Publishing the tested build; on main only, and only after the tests above.
      - name: Image tag and registry credentials for the image step
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          # The step below runs kaniko, not a shell: the tag has to be ready here.
          echo "IMAGE_TAG=sha-$(echo "${{ github.sha }}" | cut -c1-12)" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.docker"
          printf '{"auths":{"git.knubbel.me":{"username":"%s","password":"%s"}}}' \
            "${{ github.repository_owner }}" "$REGISTRY_TOKEN" > "$GITHUB_WORKSPACE/.docker/config.json"
      - name: Package the tested build as git.knubbel.me/teadeck/teadeck:sha-<commit>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Daemonless image build (maintained fork of the archived Kaniko project); no Docker socket for jobs.
        uses: docker://ghcr.io/osscontainertools/kaniko:v1.28.4-debug@sha256:716ab47e2f730a52edec6ab75a2866668012eaaa9c2d09ffec319c4a349448e3
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: >-
            --context dir://${{ github.workspace }}
            --dockerfile container/Dockerfile
            --destination git.knubbel.me/teadeck/teadeck:${{ env.IMAGE_TAG }}
            --label org.opencontainers.image.source=https://git.knubbel.me/${{ github.repository }}
            --label org.opencontainers.image.revision=${{ github.sha }}
      - name: Point latest at this build, if the commit is still the head of main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          # Only this step gets repository access (not stored in .git/config for the whole job).
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://git.knubbel.me/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          node scripts/promote_image.mjs --image git.knubbel.me/teadeck/teadeck \
            --from "$IMAGE_TAG" --to latest \
            --commit "${{ github.sha }}" --branch main
      # The registry token is written to the workspace for kaniko; it must not outlive the job,
      # also when packaging or promoting failed.
      - name: Remove the registry credentials
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/.docker"
