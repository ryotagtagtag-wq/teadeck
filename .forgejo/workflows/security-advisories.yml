# Daily: has Mastodon published a security advisory that is not assessed for Teadeck yet?
# The run fails, listing the advisory, until security/mastodon-advisories.json has an entry for it
# (see scripts/check_advisories.mjs for what to assess). Independent of the weekly upstream update,
# so a fix does not wait for it.
name: security-advisories

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: docker
    container:
      image: node:24-bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unassessed Mastodon security advisories
        run: node scripts/check_advisories.mjs
