<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img"
     aria-label="A steaming cup of tea" data-teadeck-logo="teacup">
  <defs>
    <linearGradient id="tea-ceramic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--teadeck-logo-tea-dark, #6e2a08)"/>
      <stop offset="0.55" stop-color="var(--teadeck-logo-tea, #9a4312)"/>
      <stop offset="1" stop-color="var(--teadeck-logo-tea-light, #c8671f)"/>
    </linearGradient>
    <linearGradient id="teaSides-ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teadeck-logo-tea-shade, #5c2206)" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="var(--teadeck-logo-tea-shade, #5c2206)" stop-opacity="0"/>
      <stop offset="0.6" stop-color="var(--teadeck-logo-tea-shade, #5c2206)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--teadeck-logo-tea-shade, #5c2206)" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="teaTop-ceramic" cx="0.42" cy="0.4" r="0.65">
      <stop offset="0" stop-color="var(--teadeck-logo-tea-light, #c8671f)"/>
      <stop offset="0.7" stop-color="var(--teadeck-logo-tea, #9a4312)"/>
      <stop offset="1" stop-color="var(--teadeck-logo-tea-dark, #6e2a08)"/>
    </radialGradient>
    <linearGradient id="wall-ceramic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--teadeck-logo-body, #c8c6ff)"/>
      <stop offset="0.5" stop-color="var(--teadeck-logo-body, #c8c6ff)"/>
      <stop offset="1" stop-color="var(--teadeck-logo-body-dark, #15161e)"/>
    </linearGradient>
    <radialGradient id="glow-ceramic" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--teadeck-logo-tea-light, #c8671f)" stop-opacity="0.3"/>
      <stop offset="1" stop-color="var(--teadeck-logo-tea-light, #c8671f)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow-ceramic" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="var(--teadeck-logo-body-dark, #15161e)" stop-opacity="0.4"/>
      <stop offset="1" stop-color="var(--teadeck-logo-body-dark, #15161e)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steam-ceramic" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="180">
      <stop offset="0" stop-color="var(--teadeck-logo-steam, #a6abc4)" stop-opacity="0"/>
      <stop offset="0.55" stop-color="var(--teadeck-logo-steam, #a6abc4)" stop-opacity="0.45"/>
      <stop offset="1" stop-color="var(--teadeck-logo-steam, #a6abc4)" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bowl-ceramic">
      <path d="M95 190 C95 254 117 310 161 325 L239 325 C283 310 305 254 305 190 Z"/>
    </clipPath>
    <clipPath id="surface-ceramic">
      <ellipse cx="200" cy="191" rx="103" ry="17"/>
    </clipPath>
    <mask id="handleRim-ceramic" maskUnits="userSpaceOnUse" x="270" y="190" width="120" height="130">
      <rect x="270" y="190" width="120" height="130" fill="#ffffff"/>
      <path d="M303 218 C356 206 362 288 288 298" fill="none" stroke="#000000" stroke-width="18.5" stroke-linecap="round"/>
    </mask>
  </defs>

  <g class="teadeck-logo-steam--soft" transform="translate(0 8)" fill="none" stroke="url(#steam-ceramic)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 176 C151 151 190 133 173 108 C154 80 187 67 181 43"/>
    <path d="M205 170 C181 143 225 126 205 97 C187 70 230 54 224 27"/>
    <path d="M233 176 C215 153 252 139 239 114 C228 92 251 78 248 57"/>
  </g>
  <g class="teadeck-logo-steam--angular" transform="translate(0 8)" fill="none" stroke="url(#steam-ceramic)" stroke-width="11" stroke-linecap="round" stroke-linejoin="miter">
    <path d="M176 176 L165 144 L187 136 L171 102 L195 70"/>
    <path d="M205 170 L193 133 L221 123 L203 88 L235 58"/>
    <path d="M233 176 L225 152 L246 144 L238 114"/>
  </g>

  <path d="M50 336 C62 378 338 378 350 336 Z" fill="var(--teadeck-logo-body-dark, #15161e)" fill-opacity="0.18"/>
  <ellipse cx="200" cy="336" rx="150" ry="24" fill="var(--teadeck-logo-body, #c8c6ff)" fill-opacity="0.9" stroke="var(--teadeck-logo-line, #a6abc4)" stroke-opacity="0.5" stroke-width="3.75"/>
  <path d="M50 336 C62 378 338 378 350 336" fill="none" stroke="var(--teadeck-logo-line, #a6abc4)" stroke-opacity="0.55" stroke-width="5"/>
  <ellipse cx="200" cy="339" rx="92" ry="13" fill="var(--teadeck-logo-body-dark, #15161e)" fill-opacity="0.12" stroke="var(--teadeck-logo-line, #a6abc4)" stroke-opacity="0.25" stroke-width="2.5"/>

  <ellipse cx="200" cy="338" rx="72" ry="10" fill="url(#shadow-ceramic)"/>
  <ellipse cx="208" cy="340" rx="78" ry="11" fill="url(#glow-ceramic)"/>
  <path d="M70 332 C88 324 112 319 135 317" fill="none" stroke="var(--teadeck-logo-highlight, #ffffff)" stroke-opacity="0.099" stroke-width="5" stroke-linecap="round"/>

  <g transform="translate(0 8)">
  <g fill="none" stroke-linecap="round">
    <path d="M303 218 C356 206 362 288 288 298" stroke="var(--teadeck-logo-line, #a6abc4)" stroke-opacity="0.6" stroke-width="22" mask="url(#handleRim-ceramic)"/>
    <path d="M303 218 C356 206 362 288 288 298" stroke="var(--teadeck-logo-body, #c8c6ff)" stroke-opacity="1" stroke-width="18.5"/>
    <path d="M303 218 C356 206 362 288 288 298" stroke="var(--teadeck-logo-body-dark, #15161e)" stroke-opacity="0.18" stroke-width="10.2"/>
    <path d="M320 216 C344 219 351 243 343 263" stroke="var(--teadeck-logo-highlight, #ffffff)" stroke-opacity="0.19" stroke-width="3.5"/>
  </g>

  <path d="M92 190 A108 19 0 0 1 308 190" fill="none" stroke="var(--teadeck-logo-line, #a6abc4)" stroke-opacity="0.35" stroke-width="3.75"/>

  <path d="M92 190 C92 255 115 312 160 328 L240 328 C285 312 308 255 308 190"
        fill="url(#wall-ceramic)" stroke="var(--teadeck-logo-line, #a6abc4)" stroke-opacity="0.7" stroke-width="6.25"/>
  <g clip-path="url(#surface-ceramic)">
    <ellipse cx="200" cy="191" rx="103" ry="17" fill="url(#teaTop-ceramic)"/>
    <path d="M97 189 A103 17 0 0 1 303 189" fill="none" stroke="var(--teadeck-logo-tea-shade, #5c2206)" stroke-opacity="0.35" stroke-width="7"/>
    <path d="M99 194 A103 17 0 0 0 301 194" fill="none" stroke="var(--teadeck-logo-tea-light, #c8671f)" stroke-opacity="0.5" stroke-width="4"/>
    <ellipse cx="176" cy="187" rx="34" ry="5" fill="var(--teadeck-logo-highlight, #ffffff)" fill-opacity="0.22"/>
  </g>

  <path d="M92 190 A108 19 0 0 0 308 190" fill="none" stroke="var(--teadeck-logo-highlight, #ffffff)" stroke-opacity="0.8" stroke-width="7.5"/>
  <path d="M100 196 A100 15 0 0 0 300 196" fill="none" stroke="var(--teadeck-logo-highlight, #ffffff)" stroke-opacity="0.066" stroke-width="3.75"/>

  <path d="M106 208 C108 246 120 280 140 304" fill="none" stroke="var(--teadeck-logo-highlight, #ffffff)" stroke-opacity="0.22" stroke-width="12.5" stroke-linecap="round"/>
  <path d="M118 214 C120 232 124 246 130 258" fill="none" stroke="var(--teadeck-logo-highlight, #ffffff)" stroke-opacity="0.11" stroke-width="5" stroke-linecap="round"/>
  <path d="M294 222 C291 246 284 266 274 281" fill="none" stroke="var(--teadeck-logo-body, #c8c6ff)" stroke-opacity="0.14" stroke-width="7.5" stroke-linecap="round"/>
  </g>
</svg>
