worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Deliberately exclude query strings (OAuth codes/state) from logs.
    log_format static '$remote_addr $request_method $uri $status';
    access_log /dev/stdout static;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Changing a header here changes the offline version (scripts/build.mjs hashes this file),
    # so installed apps pick up the new headers with the next update.
    map $uri $cache_control {
        default 'no-cache';
        # The service worker script decides when a new version installs; never serve it stale.
        /sw.js 'no-cache';
        # Only names with a content hash (Vite output) never change; the same rule as HASHED_NAME in sw.js.
        # emoji/1f600.svg, loading.png etc. keep their name across builds and are revalidated.
        "~-[A-Za-z0-9_-]{8}\.(js|css|woff2?|png|svg|jpg|webp|json)$" 'public, max-age=31536000, immutable';
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        server_tokens off;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:; img-src 'self' https: data: blob:; media-src 'self' https: blob:; font-src 'self'; worker-src 'self' blob:; frame-src https:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        location = /healthz { access_log off; return 200 'ok'; }
        # Written by container/entrypoint.sh from TEADECK_LOGO; without it there is no logo.
        location = /logo.svg { root /tmp/logo; try_files /logo.svg =404; }
        # The design this deployment starts with (TEADECK_THEME, TEADECK_COLOR_SCHEME).
        location = /teadeck.json { root /tmp/config; try_files /teadeck.json =404; }
        location ^~ /api/ { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(js|css|map|woff2?|png|svg|jpg|webp|json|gz|ico|mp3|ogg)$ { try_files $uri =404; }
        location / { try_files $uri /index.html; }
    }
}
